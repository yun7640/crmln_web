<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRMLN 검토 대시보드 · 로그인</title>
<style>
:root{--navy:#1F3A5F;--blue:#2C6E9B;--ink:#1a2330;--muted:#6b7683;--bg:#eef2f6;--line:#d7dee6}
*{box-sizing:border-box}
body{margin:0;font-family:'맑은 고딕','Malgun Gothic',system-ui,sans-serif;background:linear-gradient(135deg,#e9eff5,#dbe6f0);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.card{background:#fff;width:360px;max-width:92vw;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(31,58,95,.12);overflow:hidden}
.head{background:var(--navy);color:#fff;padding:20px 22px}
.head h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.2px}
.head p{margin:4px 0 0;font-size:11.5px;color:#c7d6e6}
form{padding:20px 22px 22px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(44,110,155,.15)}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
button:hover{background:#245d84}
.err{background:#fdecea;color:#c0392b;font-size:12px;padding:8px 10px;border-radius:7px;margin-top:12px}
.foot{font-size:10.5px;color:var(--muted);text-align:center;padding:0 22px 18px}
</style></head>
<body>
<div class="card">
  <div class="head"><h1>CRMLN 측정결과 검토 대시보드</h1><p>KDCA NMRL (Lab 509) · 로그인 필요</p></div>
  <form method="post" autocomplete="off">
    {% with messages = get_flashed_messages() %}{% if messages %}<div class="err">{{ messages[0] }}</div>{% endif %}{% endwith %}
    <label for="username">아이디</label>
    <input id="username" name="username" required autofocus>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" required>
    <button type="submit">로그인</button>
  </form>
  <div class="foot">허가된 사용자 전용 · 측정·검토 자료는 검토자 확인 후 확정</div>
</div>
</body></html>
